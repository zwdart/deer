# =============================================================================
# dchat / deer 全平台生产发布工作流
# 触发：推送 v* 格式的 Git Tag 时自动构建并发布；也可在 Actions 面板手动触发。
#       git tag v1.2.3 && git push origin v1.2.3
#
# 产物一览（每个架构独立构建，绝不混包）：
#   Android   → armeabi-v7a / arm64-v8a / x86_64 APK + universal APK + AAB
#   Windows   → x64 / arm64 各自产出：.msix 安装包 + Enigma Virtual Box 单文件 exe + 目录式 zip
#   Linux     → amd64 / arm64 各自产出：.deb 安装包 + .AppImage 单文件免安装
#   macOS     → arm64 / x64 各自产出：.dmg + .zip(含 .app)，跳过 Apple 签名
#
# -----------------------------------------------------------------------------
# 【GitHub Secrets 配置清单】
# Settings → Secrets and variables → Actions → New repository secret
#
# Android 发布签名（不配也能打包，但用的是 Flutter 默认 debug 签名，
# 不能上传 Google Play、与将来配置后的 release 签名互不兼容）：
#
#   1) 本地生成 keystore（只需做一次，务必备份到安全位置！）
#        keytool -genkey -v -keystore release.keystore \
#          -keyalg RSA -keysize 2048 -validity 10000 -alias upload
#        执行时会要求输入：keystore 密码、姓名、组织、key 密码（建议和上面相同）
#
#   2) 把 keystore 转成 base64
#        macOS:   base64 -i release.keystore | pbcopy
#        Linux:   base64 -w 0 release.keystore   # 然后手动复制终端输出
#        Windows(PowerShell):
#                 [Convert]::ToBase64String([IO.File]::ReadAllBytes("release.keystore"))
#
#   3) 在 GitHub 仓库 Settings → Secrets and variables → Actions 中新增以下 4 项：
#
#        Secret 名称                        值
#        ──────────────────────────────────────────────────────────
#        ANDROID_KEYSTORE_BASE64            上面生成的 base64 字符串
#        ANDROID_KEYSTORE_PASSWORD          生成 keystore 时输入的密码
#        ANDROID_KEY_ALIAS                  上面命令里的 alias（本例是 upload）
#        ANDROID_KEY_PASSWORD               该 alias 对应的 key 密码
#
#      不配这 4 个也能跑，工作流会自动用 debug 签名；
#      但一旦配了就别丢 keystore——Google Play 上的 app 无法更换签名。
#
# 其它平台：Windows / Linux / macOS 构建和打包都不依赖任何 Secret。
# =============================================================================

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.47.5"
  # APP_NAME 只用于发布产物文件名（deer-v1.0.0-...）
  APP_NAME: "deer"
  # BIN_NAME 是 Flutter 真实产物名：linux/CMakeLists.txt BINARY_NAME、windows/CMakeLists.txt
  # BINARY_NAME、macos/Runner/Configs/AppInfo.xcconfig PRODUCT_NAME 都是 dchat
  BIN_NAME: "dchat"

jobs:
  # ---------------------------------------------------------------------------
  # Android（同一 runner 同时产出三 ABI，本来就是分开的）
  # ---------------------------------------------------------------------------
  android:
    name: Android packages
    runs-on: ubuntu-24.04
    env:
      # 提升到 job 级，step 的 if 才能读到（step 级 env 在自身 if 中不可见）
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          cache-key: flutter-android-${{ runner.os }}-${{ env.FLUTTER_VERSION }}

      - name: Configure signing
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - run: flutter pub get

      - name: Build split APKs (per ABI)
        run: flutter build apk --release --split-per-abi --obfuscate --split-debug-info=build/debug-info/android
      - name: Build universal APK
        run: flutter build apk --release --obfuscate --split-debug-info=build/debug-info/android
      - name: Build App Bundle
        run: flutter build appbundle --release --obfuscate --split-debug-info=build/debug-info/android

      - name: Rename artifacts
        run: |
          cd build/app/outputs/flutter-apk
          cp app-armeabi-v7a-release.apk ${APP_NAME}-android-armeabi-v7a.apk
          cp app-arm64-v8a-release.apk    ${APP_NAME}-android-arm64-v8a.apk
          cp app-x86_64-release.apk       ${APP_NAME}-android-x86_64.apk
          cp app-release.apk              ${APP_NAME}-android-universal.apk
          cp ../bundle/release/app-release.aab ../bundle/release/${APP_NAME}-android.aab

      - uses: actions/upload-artifact@v4
        with:
          name: android-packages
          path: |
            build/app/outputs/flutter-apk/${{ env.APP_NAME }}-android-*.apk
            build/app/outputs/bundle/release/${{ env.APP_NAME }}-android.aab
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Windows：x64 + arm64 各自独立 Job，互不干扰
  # ---------------------------------------------------------------------------
  windows:
    name: Windows ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            flutter_channel: stable
            flutter_arch: x64
            build_dir: build/windows/x64/runner/Release
            artifact: windows-x64
          - arch: arm64
            runner: windows-11-arm
            # stable 未发布 arm64 SDK 归档，master 会自动从 tag 克隆并引导 Dart SDK
            flutter_channel: master
            flutter_arch: arm64
            build_dir: build/windows/arm64/runner/Release
            artifact: windows-arm64
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ matrix.flutter_channel }}
          cache: true
          cache-key: flutter-${{ matrix.artifact }}-${{ runner.os }}-${{ env.FLUTTER_VERSION }}

      - run: flutter --version
      - run: flutter precache --windows
      - run: flutter pub get

      - name: Build Windows release (${{ matrix.arch }})
        run: flutter build windows --release --obfuscate --split-debug-info=build/debug-info/windows/${{ matrix.arch }}

      # 目录式便携 zip
      - name: Package portable zip
        shell: pwsh
        run: |
          Compress-Archive -Path "${{ matrix.build_dir }}\*" `
            -DestinationPath "${{ matrix.build_dir }}\${APP_NAME}-${{ matrix.artifact }}-portable.zip" -Force

      # MSIX 安装包。
      # 注意：`dart pub global activate msix` 会把可执行文件装到 %PUB_CACHE%\bin，
      # 但 Windows runner 上该目录不一定在 PATH 中，直接调用 `msix` 会报
      # "The term 'msix' is not recognized"。改用 `dart pub global run msix:build`
      # 走激活后的执行入口，绕过 PATH 问题（也避免 PowerShell 找不到 .bat 扩展名）。
      - name: Build MSIX installer
        shell: pwsh
        run: |
          dart pub global activate msix

          # 直接写配置，不调用 msix create-config（它在 PATH 缺失时会以
          # 「命令未找到」的终止错误结束，连 `|| true` 都兜不住）
          @"
          msix_config:
            display_name: $env:APP_NAME
            publisher_display_name: Local
            publisher: CN=Local
            identity_name: com.local.$env:APP_NAME
            msix_version: 1.0.0.0
            logo_path: assets/icon.png
            certificate_path: ""
          "@ | Out-File -FilePath msix_config.yaml -Encoding utf8

          dart pub global run msix:build

          # 兜底：把任意位置生成的 .msix 统一搬到 build_dir，确保 upload-artifact 找得到
          $found = Get-ChildItem -Recurse -Filter *.msix -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if ($found) {
            Move-Item $found.FullName `
              "${{ matrix.build_dir }}\$env:APP_NAME-${{ matrix.artifact }}.msix" -Force
            Write-Host "==> MSIX staged: $env:APP_NAME-${{ matrix.artifact }}.msix"
          } else {
            Write-Host "==> No .msix produced; skipping (upload will tolerate via error-if-missing)."
          }

      # -----------------------------------------------------------------------
      # Enigma Virtual Box：把整个 Release 目录封成单文件 exe。
      # 免费工具，命令行：EnigmaVB.exe <主exe> -output=<输出exe> -root=<附属根目录>
      # 下载地址：https://enigmaprotector.com/en/downloads
      # -----------------------------------------------------------------------
      - name: Download Enigma Virtual Box
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri "https://enigmaprotector.com/download/EnigmaVB.zip" `
            -OutFile EnigmaVB.zip
          Expand-Archive -Path EnigmaVB.zip -DestinationPath EnigmaVB -Force

      - name: Build single-file portable exe via Enigma Virtual Box
        shell: pwsh
        run: |
          $releaseDir = "${{ matrix.build_dir }}"
          $mainExe    = "$releaseDir\$env:BIN_NAME.exe"
          $outputExe  = "$releaseDir\$env:APP_NAME-${{ matrix.artifact }}-portable.exe"
          $enigmaExe  = "EnigmaVB\EnigmaVB.exe"

          Write-Host "==> Packing single-file exe with Enigma Virtual Box (${{ matrix.arch }})"
          & $enigmaExe $mainExe "-output=$outputExe" "-root=$releaseDir"
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Enigma returned $LASTEXITCODE; falling back to zip only."
            exit 0
          }
          Write-Host "==> Done: $outputExe ($([math]::Round((Get-Item $outputExe).Length / 1MB)) MB)"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.build_dir }}/${{ env.APP_NAME }}-${{ matrix.artifact }}-portable.exe
            ${{ matrix.build_dir }}/${{ env.APP_NAME }}-${{ matrix.artifact }}-portable.zip
            ${{ matrix.build_dir }}/*.msix
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Linux：amd64 + arm64 各自独立 Job
  # ---------------------------------------------------------------------------
  linux:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            flutter_channel: stable
            target_platform: linux-x64
            bundle_dir: build/linux/x64/release/bundle
            artifact_tag: linux-amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            # stable 未发布 arm64 SDK 归档
            flutter_channel: master
            target_platform: linux-arm64
            bundle_dir: build/linux/arm64/release/bundle
            artifact_tag: linux-arm64
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            clang cmake ninja-build pkg-config g++ \
            libgtk-3-dev liblzma-dev libx11-dev libxi-dev \
            libayatana-appindicator3-dev \
            libarchive-dev patchelf desktop-file-utils file

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ matrix.flutter_channel }}
          cache: true
          cache-key: flutter-${{ matrix.artifact_tag }}-${{ runner.os }}-${{ env.FLUTTER_VERSION }}

      - run: flutter --version
      - run: flutter precache --linux
      - run: flutter pub get

      - name: Build Linux release (${{ matrix.arch }})
        run: |
          flutter build linux --release \
            --target-platform ${{ matrix.target_platform }} \
            --obfuscate \
            --split-debug-info=build/debug-info/linux/${{ matrix.arch }}

      # -----------------------------------------------------------------------
      # 统一目录树：.deb 与 AppImage 共用 /opt/<app> 布局
      #   /opt/deer/deer + lib/ + data/   ← 整个 Flutter bundle 原样放这里
      #   /usr/bin/deer                   ← 相对软链，保证 /proc/self/exe 同级有 data/
      # -----------------------------------------------------------------------
      - name: Prepare release tree
        run: |
          set -e
          BUNDLE="${{ matrix.bundle_dir }}"
          ROOTDIR="build/linux/root"
          APP_ID="com.local.${APP_NAME}"

          rm -rf "$ROOTDIR"
          mkdir -p "$ROOTDIR/opt/${BIN_NAME}"
          mkdir -p "$ROOTDIR/usr/bin"
          mkdir -p "$ROOTDIR/usr/share/applications"
          mkdir -p "$ROOTDIR/usr/share/icons/hicolor/512x512/apps"

          cp -a "$BUNDLE/." "$ROOTDIR/opt/${BIN_NAME}/"

          # 相对软链：deb 中解析为 /opt/dchat/dchat；AppImage 中解析为挂载点/opt/dchat/dchat
          ln -sf "../../opt/${BIN_NAME}/${BIN_NAME}" "$ROOTDIR/usr/bin/${BIN_NAME}"

          {
            echo "[Desktop Entry]"
            echo "Name=${APP_NAME}"
            echo "Exec=${BIN_NAME}"
            echo "Icon=${APP_ID}"
            echo "Type=Application"
            echo "Categories=Network;Chat;"
            echo "Terminal=false"
            echo "StartupNotify=true"
          } > "$ROOTDIR/usr/share/applications/${APP_ID}.desktop"

          cp assets/icon.png "$ROOTDIR/usr/share/icons/hicolor/512x512/apps/${APP_ID}.png"

      # -----------------------------------------------------------------------
      # .deb 安装包：直接用 dpkg-deb 打包，不依赖 flutter_to_debian
      # （flutter_to_debian 2.x 已移除 --main-exe 等旧参数，且行为不稳定）
      # -----------------------------------------------------------------------
      - name: Build .deb installer
        run: |
          set -e
          ROOTDIR="build/linux/root"
          DEBROOT="build/linux/deb"
          VERSION="$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//')"
          VERSION="${VERSION:-1.0.0}"

          rm -rf "$DEBROOT"
          cp -a "$ROOTDIR/." "$DEBROOT/"
          mkdir -p "$DEBROOT/DEBIAN"

          {
            echo "Package: ${APP_NAME}"
            echo "Version: ${VERSION}"
            echo "Architecture: ${{ matrix.arch }}"
            echo "Maintainer: local <local@localhost>"
            echo "Installed-Size: $(du -sk "$DEBROOT" | cut -f1)"
            echo "Depends: libgtk-3-0, libglib2.0-0"
            echo "Section: net"
            echo "Priority: optional"
            echo "Description: dchat LAN peer-to-peer chat"
            echo " deer (dchat) is a LAN peer-to-peer chat client compatible with the zchat protocol."
          } > "$DEBROOT/DEBIAN/control"

          chmod 0644 "$DEBROOT/DEBIAN/control"
          dpkg-deb --build --root-owner-group "$DEBROOT" \
            "build/linux/${APP_NAME}-${{ matrix.artifact_tag }}.deb"
          ls -lh "build/linux/${APP_NAME}-${{ matrix.artifact_tag }}.deb"

      # -----------------------------------------------------------------------
      # AppImage 单文件免安装：复用同一棵树组装 AppDir 再打包
      # -----------------------------------------------------------------------
      - name: Build .AppImage (${{ matrix.arch }})
        run: |
          set -e
          ROOTDIR="build/linux/root"
          APPDIR="build/linux/AppDir"
          APP_ID="com.local.${APP_NAME}"

          rm -rf "$APPDIR"
          cp -a "$ROOTDIR/." "$APPDIR/"
          # AppImage 规范：根目录必须有 .desktop 和同名图标
          cp "$ROOTDIR/usr/share/applications/${APP_ID}.desktop" "$APPDIR/"
          cp assets/icon.png "$APPDIR/${APP_ID}.png"

          cat > "$APPDIR/AppRun" <<RUNEOF
          #!/bin/sh
          HERE="\$(dirname "\$(readlink -f "\$0")")"
          exec "\$HERE/opt/${BIN_NAME}/${BIN_NAME}" "\$@"
          RUNEOF
          chmod +x "$APPDIR/AppRun"

          # appimagetool 按架构发布独立文件；Ubuntu 24.04 无 libfuse2，
          # 用 --appimage-extract-and-run 免 FUSE 运行
          case "${{ matrix.arch }}" in
            amd64) TOOL_ARCH=x86_64 ;;
            arm64) TOOL_ARCH=aarch64 ;;
            *) echo "unsupported arch: ${{ matrix.arch }}"; exit 1 ;;
          esac
          curl -fL --retry 5 --retry-delay 3 --connect-timeout 20 -o appimagetool \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${TOOL_ARCH}.AppImage"
          chmod +x appimagetool

          export ARCH="$TOOL_ARCH"
          ./appimagetool --appimage-extract-and-run "$APPDIR" \
            "build/linux/${APP_NAME}-${{ matrix.artifact_tag }}-portable.AppImage"
          chmod +x "build/linux/${APP_NAME}-${{ matrix.artifact_tag }}-portable.AppImage"
          ls -lh "build/linux/${APP_NAME}-${{ matrix.artifact_tag }}-portable.AppImage"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_tag }}
          path: |
            build/linux/${{ env.APP_NAME }}-${{ matrix.artifact_tag }}-portable.AppImage
            build/linux/${{ env.APP_NAME }}-${{ matrix.artifact_tag }}.deb
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # macOS：arm64 + x64 各自独立 Job，不做 Universal Binary
  # ---------------------------------------------------------------------------
  macos:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
            xcode_arch: arm64
            artifact_tag: macos-arm64
          - arch: x64
            runner: macos-15-intel
            xcode_arch: x86_64
            artifact_tag: macos-x64
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          cache-key: flutter-${{ matrix.artifact_tag }}-${{ runner.os }}-${{ env.FLUTTER_VERSION }}

      - run: flutter pub get

      - name: Build macOS (${{ matrix.arch }})
        env:
          FLUTTER_XCODE_ARCHS: ${{ matrix.xcode_arch }}
        run: |
          # 注意：flutter build macos 没有 --no-codesign 选项（那是 build ios 的）。
          # Flutter 在 macOS 上默认使用本地 ad-hoc 签名（"-"），无需开发者证书。
          flutter build macos --release \
            --obfuscate \
            --split-debug-info=build/debug-info/macos/${{ matrix.arch }}

      # 无 Apple 证书时的兜底：对 .app 做一次 ad-hoc 签名。
      # arm64 上缺少有效签名的 app 可能无法启动；zip/dmg 分发不要求公证。
      - name: Ad-hoc sign app
        run: |
          codesign --force --deep --sign - \
            "build/macos/Build/Products/Release/${BIN_NAME}.app"
          codesign -dv "build/macos/Build/Products/Release/${BIN_NAME}.app" 2>&1 | head -5

      # .zip 保留父目录，解压直接得到 .app
      - name: Package .zip
        run: |
          cd build/macos/Build/Products/Release
          /usr/bin/ditto -c -k --keepParent "${BIN_NAME}.app" \
            "${APP_NAME}-${{ matrix.artifact_tag }}.zip"

      # .dmg：用 create-dmg 创建带窗口样式的安装镜像
      - name: Build .dmg installer
        run: |
          set -e
          BUNDLE="build/macos/Build/Products/Release"
          APP_PATH="${BUNDLE}/${BIN_NAME}.app"
          OUTPUT="build/macos/${APP_NAME}-${{ matrix.artifact_tag }}.dmg"

          command -v create-dmg || brew install create-dmg

          create-dmg \
            --skip-jenkins \
            --volname "${APP_NAME}" \
            --window-size 520 320 \
            --icon-size 100 \
            --icon "${BIN_NAME}.app" 140 160 \
            --app-drop-link 380 160 \
            "$OUTPUT" \
            "$APP_PATH"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_tag }}
          path: |
            build/macos/Build/Products/Release/${{ env.APP_NAME }}-${{ matrix.artifact_tag }}.zip
            build/macos/${{ env.APP_NAME }}-${{ matrix.artifact_tag }}.dmg
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 汇总：下载所有架构产物 → 平铺到同一目录 → 创建 GitHub Release 上传
  # ---------------------------------------------------------------------------
  publish:
    name: Publish release
    needs: [android, windows, linux, macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Inspect & stage release assets
        run: |
          ls -lah artifacts/
          mkdir -p packages
          # 复制所有产物；各平台各架构文件名已带 tag，天然不冲突
          cp -v artifacts/* packages/
          echo ""
          echo "==> Final release assets:"
          ls -lh packages/

      - name: Create GitHub release & upload all assets
        uses: softprops/action-gh-release@v2
        with:
          files: packages/*
          generate_release_notes: true
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
