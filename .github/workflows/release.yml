# =============================================================================
# deer / deer 全平台生产发布工作流
# 触发：推送 v* 格式的 Git Tag 时自动构建并发布；也可在 Actions 面板手动触发。
#       git tag v1.2.3 && git push origin v1.2.3
#
# 产物一览（每个架构独立构建，绝不混包）：
#   Android   → armeabi-v7a / arm64-v8a / x86_64 APK + universal APK + AAB
#   Windows   → x64 / arm64 各自产出：.msix 安装包 + 7-Zip SFX 单文件 exe + 目录式 zip
#   Linux     → amd64 / arm64 各自产出：.deb 安装包 + .AppImage 单文件免安装
#   macOS     → arm64 / x64 各自产出：.dmg + .zip(含 .app)，跳过 Apple 签名
#
# -----------------------------------------------------------------------------
# 【GitHub Secrets 配置清单】
# Settings → Secrets and variables → Actions → New repository secret
#
# Android 发布签名（不配也能打包，但用的是 Flutter 默认 debug 签名，
# 不能上传 Google Play、与将来配置后的 release 签名互不兼容）：
#
#   1) 本地生成 keystore（只需做一次，务必备份到安全位置！）
#        keytool -genkey -v -keystore release.keystore \
#          -keyalg RSA -keysize 2048 -validity 10000 -alias upload
#        执行时会要求输入：keystore 密码、姓名、组织、key 密码（建议和上面相同）
#
#   2) 把 keystore 转成 base64
#        macOS:   base64 -i release.keystore | pbcopy
#        Linux:   base64 -w 0 release.keystore   # 然后手动复制终端输出
#        Windows(PowerShell):
#                 [Convert]::ToBase64String([IO.File]::ReadAllBytes("release.keystore"))
#
#   3) 在 GitHub 仓库 Settings → Secrets and variables → Actions 中新增以下 4 项：
#
#        Secret 名称                        值
#        ──────────────────────────────────────────────────────────
#        ANDROID_KEYSTORE_BASE64            上面生成的 base64 字符串
#        ANDROID_KEYSTORE_PASSWORD          生成 keystore 时输入的密码
#        ANDROID_KEY_ALIAS                  上面命令里的 alias（本例是 upload）
#        ANDROID_KEY_PASSWORD               该 alias 对应的 key 密码
#
#      不配这 4 个也能跑，工作流会自动用 debug 签名；
#      但一旦配了就别丢 keystore——Google Play 上的 app 无法更换签名。
#
# 其它平台：Windows / Linux / macOS 构建和打包都不依赖任何 Secret。
# =============================================================================

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.47.5"
  # APP_NAME 只用于发布产物文件名（deer-v1.0.0-...）
  APP_NAME: "deer"
  # BIN_NAME 是 Flutter 真实产物名：linux/CMakeLists.txt BINARY_NAME、windows/CMakeLists.txt
  # BINARY_NAME、macos/Runner/Configs/AppInfo.xcconfig PRODUCT_NAME 都是 deer
  BIN_NAME: "deer"

jobs:
  # ---------------------------------------------------------------------------
  # Android（同一 runner 同时产出三 ABI，本来就是分开的）
  # ---------------------------------------------------------------------------
  android:
    name: Android packages
    runs-on: ubuntu-24.04
    env:
      # 提升到 job 级，step 的 if 才能读到（step 级 env 在自身 if 中不可见）
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          cache-key: flutter-android-${{ runner.os }}-${{ env.FLUTTER_VERSION }}

      - name: Configure signing
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - run: flutter pub get

      - name: Build APKs + AAB (带网络重试)
        run: |
          set -e
          # Maven Central 对 GitHub Actions 的共享出口 IP 偶发 429 限流
          # （Could not GET ... Received status code 429 from server: Too Many Requests）。
          # 这是网络抖动而非代码问题，失败时等待后重试最多 3 次。
          build_with_retry() {
            for attempt in 1 2 3; do
              if "$@"; then
                return 0
              fi
              echo "==> attempt ${attempt} failed, retrying in 20s..."
              sleep 20
            done
            return 1
          }
          build_with_retry flutter build apk --release --split-per-abi \
            --obfuscate --split-debug-info=build/debug-info/android
          build_with_retry flutter build apk --release \
            --obfuscate --split-debug-info=build/debug-info/android
          build_with_retry flutter build appbundle --release \
            --obfuscate --split-debug-info=build/debug-info/android

      - name: Rename artifacts
        run: |
          cd build/app/outputs/flutter-apk
          cp app-armeabi-v7a-release.apk ${APP_NAME}-android-armeabi-v7a.apk
          cp app-arm64-v8a-release.apk    ${APP_NAME}-android-arm64-v8a.apk
          cp app-x86_64-release.apk       ${APP_NAME}-android-x86_64.apk
          cp app-release.apk              ${APP_NAME}-android-universal.apk
          cp ../bundle/release/app-release.aab ../bundle/release/${APP_NAME}-android.aab

      - uses: actions/upload-artifact@v4
        with:
          name: android-packages
          path: |
            build/app/outputs/flutter-apk/${{ env.APP_NAME }}-android-*.apk
            build/app/outputs/bundle/release/${{ env.APP_NAME }}-android.aab
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Windows：x64 + arm64 各自独立 Job，互不干扰
  # ---------------------------------------------------------------------------
  windows:
    name: Windows ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            flutter_channel: stable
            flutter_arch: x64
            build_dir: build/windows/x64/runner/Release
            artifact: windows-x64
          - arch: arm64
            runner: windows-11-arm
            # stable 未发布 arm64 SDK 归档，master 会自动从 tag 克隆并引导 Dart SDK
            flutter_channel: master
            flutter_arch: arm64
            build_dir: build/windows/arm64/runner/Release
            artifact: windows-arm64
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ matrix.flutter_channel }}
          cache: true
          cache-key: flutter-${{ matrix.artifact }}-${{ runner.os }}-${{ env.FLUTTER_VERSION }}

      - run: flutter --version
      - run: flutter precache --windows
      - run: flutter pub get

      - name: Build Windows release (${{ matrix.arch }})
        run: flutter build windows --release --obfuscate --split-debug-info=build/debug-info/windows/${{ matrix.arch }}

      # -----------------------------------------------------------------------
      # 单文件免安装 exe：7-Zip SFX（自解压）
      #   1) 官方 7zr.exe（x86 控制台版，arm64 Windows 通过 x86 模拟运行）
      #   2) LZMA SDK 里提取 7zSD.sfx（支持 config.txt 的 RunProgram 指令）
      #   3) stub + config + payload.7z 直接拼接成一个 exe
      # 不用 Enigma Virtual Box：其官网已不再提供 EnigmaVB.zip（返回 HTML 而非压缩包），
      # 且该工具无稳定的命令行接口。
      # -----------------------------------------------------------------------
      - name: Build single-file portable exe (7-Zip SFX)
        shell: pwsh
        run: |
          $repo       = $PWD.Path
          $releaseDir = Join-Path $repo "${{ matrix.build_dir }}"
          $dist       = Join-Path $repo "build\dist"
          $outExe     = Join-Path $dist "$env:APP_NAME-${{ matrix.artifact }}-portable.exe"
          New-Item -ItemType Directory -Force $dist | Out-Null

          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri "https://www.7-zip.org/a/7zr.exe" -OutFile "$repo\7zr.exe"
          Invoke-WebRequest -Uri "https://www.7-zip.org/a/lzma2301.7z" -OutFile "$repo\lzma.7z"

          # 从 LZMA SDK 中取出 SFX stub
          & "$repo\7zr.exe" e "$repo\lzma.7z" "bin\7zSD.sfx" "-o$repo" -y | Out-Null

          # 打包整个 Release 目录（相对路径压入，解压后即 deer.exe + lib/ + data/）
          $payload = "$repo\payload.7z"
          Remove-Item $payload -ErrorAction SilentlyContinue
          Push-Location $releaseDir
          & "$repo\7zr.exe" a -mx=9 $payload * | Out-Null
          Pop-Location

          # SFX 配置（必须 UTF-8 无 BOM，否则 stub 解析失败）
          $cfg = ";!@Install@!UTF-8!`r`n" +
                 "Title=`"$env:APP_NAME`"`r`n" +
                 "RunProgram=`"$env:BIN_NAME.exe`"`r`n" +
                 ";!@InstallEnd@!`r`n"
          [System.IO.File]::WriteAllText("$repo\sfx_config.txt", $cfg,
            (New-Object System.Text.UTF8Encoding($false)))

          # stub + config + payload => 单个 exe
          $out = [System.IO.File]::Create($outExe)
          try {
            foreach ($part in @("$repo\7zSD.sfx", "$repo\sfx_config.txt", $payload)) {
              $in = [System.IO.File]::OpenRead($part)
              try { $in.CopyTo($out) } finally { $in.Dispose() }
            }
          } finally { $out.Dispose() }

          $size = [math]::Round((Get-Item $outExe).Length / 1MB)
          Write-Host "==> Portable exe: $outExe ($size MB)"

      # 目录式便携 zip（从 Release 目录压缩，放在 dist 下避免自我包含）
      - name: Package portable zip
        shell: pwsh
        run: |
          $dist = Join-Path $PWD.Path "build\dist"
          New-Item -ItemType Directory -Force $dist | Out-Null
          Compress-Archive -Path "${{ matrix.build_dir }}\*" `
            -DestinationPath "$dist\$env:APP_NAME-${{ matrix.artifact }}-portable.zip" -Force

      # MSIX 安装包。
      # 三个坑（都已在下面规避）：
      # 1) `dart pub global activate msix` 装到 %PUB_CACHE%\bin，该目录不在 PATH，
      #    直接调用 `msix` 会「命令未识别」，故用 `dart pub global run msix:build`。
      # 2) msix 3.x 从 **pubspec.yaml** 的 `msix_config:` 节点读配置，
      #    写 msix_config.yaml 完全不生效 —— 必须用命令行参数。
      # 3) msix 默认 architecture=x64、build_windows=true，会自己重跑
      #    `flutter build windows`（丢失混淆参数）并去 build\windows\runner\Release
      #    找文件；实际产物在 build\windows\<arch>\runner\Release。
      - name: Build MSIX installer
        shell: pwsh
        run: |
          dart pub global activate msix

          # 兜底：为旧版路径建一个目录联接，指向真实架构目录（msix 某些分支会读这里）
          $legacy = "build\windows\runner"
          New-Item -ItemType Directory -Force $legacy | Out-Null
          New-Item -ItemType Junction -Force `
            -Path "$legacy\Release" `
            -Target (Join-Path $PWD "${{ matrix.build_dir }}") | Out-Null

          # msix 3.18 命令分工：build 只生成「未打包的 MSIX 目录」，pack 才压成 .msix。
          # 这里必须用 create（= build + pack），否则永远拿不到 .msix 文件。
          dart pub global run msix:create `
            --architecture ${{ matrix.arch }} `
            --build-windows false `
            --install-certificate false `
            --display-name $env:APP_NAME `
            --identity-name "com.local.$env:APP_NAME" `
            --publisher "CN=Local" `
            --logo-path assets/icon.png `
            --output-path "$PWD\build\dist" `
            --output-name "$env:APP_NAME-${{ matrix.artifact }}"

          # msix 的 --output-path 并不总被遵循（有的分支仍写到默认 Release 目录），
          # 这里兜底：全仓搜一次 .msix，统一改名为带 arch tag 的文件放进 build/dist
          $target = Join-Path $PWD "build\dist\$env:APP_NAME-${{ matrix.artifact }}.msix"
          $src = Get-ChildItem -Recurse -File -Filter *.msix -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -ne $target } |
            Select-Object -First 1
          if ($src) {
            Copy-Item $src.FullName $target -Force
            Write-Host "==> MSIX staged: $target"
          } elseif (Test-Path $target) {
            Write-Host "==> MSIX already in place: $target"
          } else {
            Get-ChildItem build\dist -Recurse | Select-Object FullName | Out-Host
            throw "msix:create 未产出 .msix 文件，请检查上面的 makeappx / signtool 输出"
          }

          Get-ChildItem build\dist | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: build/dist/*
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Linux：amd64 + arm64 各自独立 Job
  # ---------------------------------------------------------------------------
  linux:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            flutter_channel: stable
            target_platform: linux-x64
            bundle_dir: build/linux/x64/release/bundle
            artifact_tag: linux-amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            # stable 未发布 arm64 SDK 归档
            flutter_channel: master
            target_platform: linux-arm64
            bundle_dir: build/linux/arm64/release/bundle
            artifact_tag: linux-arm64
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            clang cmake ninja-build pkg-config g++ \
            libgtk-3-dev liblzma-dev libx11-dev libxi-dev \
            libayatana-appindicator3-dev \
            libarchive-dev patchelf desktop-file-utils file

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ matrix.flutter_channel }}
          cache: true
          cache-key: flutter-${{ matrix.artifact_tag }}-${{ runner.os }}-${{ env.FLUTTER_VERSION }}

      - run: flutter --version
      - run: flutter precache --linux
      - run: flutter pub get

      - name: Build Linux release (${{ matrix.arch }})
        run: |
          flutter build linux --release \
            --target-platform ${{ matrix.target_platform }} \
            --obfuscate \
            --split-debug-info=build/debug-info/linux/${{ matrix.arch }}

      # -----------------------------------------------------------------------
      # 统一目录树：.deb 与 AppImage 共用 /opt/<app> 布局
      #   /opt/deer/deer + lib/ + data/   ← 整个 Flutter bundle 原样放这里
      #   /usr/bin/deer                   ← 相对软链，保证 /proc/self/exe 同级有 data/
      # -----------------------------------------------------------------------
      - name: Prepare release tree
        run: |
          set -e
          BUNDLE="${{ matrix.bundle_dir }}"
          ROOTDIR="build/linux/root"
          APP_ID="com.local.${APP_NAME}"

          rm -rf "$ROOTDIR"
          mkdir -p "$ROOTDIR/opt/${BIN_NAME}"
          mkdir -p "$ROOTDIR/usr/bin"
          mkdir -p "$ROOTDIR/usr/share/applications"
          mkdir -p "$ROOTDIR/usr/share/icons/hicolor/512x512/apps"

          cp -a "$BUNDLE/." "$ROOTDIR/opt/${BIN_NAME}/"

          # 相对软链：deb 中解析为 /opt/deer/deer；AppImage 中解析为挂载点/opt/deer/deer
          ln -sf "../../opt/${BIN_NAME}/${BIN_NAME}" "$ROOTDIR/usr/bin/${BIN_NAME}"

          {
            echo "[Desktop Entry]"
            echo "Name=${APP_NAME}"
            echo "Exec=${BIN_NAME}"
            echo "Icon=${APP_ID}"
            echo "Type=Application"
            echo "Categories=Network;Chat;"
            echo "Terminal=false"
            echo "StartupNotify=true"
          } > "$ROOTDIR/usr/share/applications/${APP_ID}.desktop"

          cp assets/icon.png "$ROOTDIR/usr/share/icons/hicolor/512x512/apps/${APP_ID}.png"

      # -----------------------------------------------------------------------
      # .deb 安装包：直接用 dpkg-deb 打包，不依赖 flutter_to_debian
      # （flutter_to_debian 2.x 已移除 --main-exe 等旧参数，且行为不稳定）
      # -----------------------------------------------------------------------
      - name: Build .deb installer
        run: |
          set -e
          ROOTDIR="build/linux/root"
          DEBROOT="build/linux/deb"
          VERSION="$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//')"
          VERSION="${VERSION:-1.0.0}"

          rm -rf "$DEBROOT"
          cp -a "$ROOTDIR/." "$DEBROOT/"
          mkdir -p "$DEBROOT/DEBIAN"

          {
            echo "Package: ${APP_NAME}"
            echo "Version: ${VERSION}"
            echo "Architecture: ${{ matrix.arch }}"
            echo "Maintainer: local <local@localhost>"
            echo "Installed-Size: $(du -sk "$DEBROOT" | cut -f1)"
            echo "Depends: libgtk-3-0, libglib2.0-0"
            echo "Section: net"
            echo "Priority: optional"
            echo "Description: deer LAN peer-to-peer chat"
            echo " deer (deer) is a LAN peer-to-peer chat client compatible with the zchat protocol."
          } > "$DEBROOT/DEBIAN/control"

          chmod 0644 "$DEBROOT/DEBIAN/control"
          dpkg-deb --build --root-owner-group "$DEBROOT" \
            "build/linux/${APP_NAME}-${{ matrix.artifact_tag }}.deb"
          ls -lh "build/linux/${APP_NAME}-${{ matrix.artifact_tag }}.deb"

      # -----------------------------------------------------------------------
      # AppImage 单文件免安装：复用同一棵树组装 AppDir 再打包
      # -----------------------------------------------------------------------
      - name: Build .AppImage (${{ matrix.arch }})
        run: |
          set -e
          ROOTDIR="build/linux/root"
          APPDIR="build/linux/AppDir"
          APP_ID="com.local.${APP_NAME}"

          rm -rf "$APPDIR"
          cp -a "$ROOTDIR/." "$APPDIR/"
          # AppImage 规范：根目录必须有 .desktop 和同名图标
          cp "$ROOTDIR/usr/share/applications/${APP_ID}.desktop" "$APPDIR/"
          cp assets/icon.png "$APPDIR/${APP_ID}.png"

          cat > "$APPDIR/AppRun" <<RUNEOF
          #!/bin/sh
          HERE="\$(dirname "\$(readlink -f "\$0")")"
          exec "\$HERE/opt/${BIN_NAME}/${BIN_NAME}" "\$@"
          RUNEOF
          chmod +x "$APPDIR/AppRun"

          # appimagetool 按架构发布独立文件；Ubuntu 24.04 无 libfuse2，
          # 用 --appimage-extract-and-run 免 FUSE 运行
          case "${{ matrix.arch }}" in
            amd64) TOOL_ARCH=x86_64 ;;
            arm64) TOOL_ARCH=aarch64 ;;
            *) echo "unsupported arch: ${{ matrix.arch }}"; exit 1 ;;
          esac
          curl -fL --retry 5 --retry-delay 3 --connect-timeout 20 -o appimagetool \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${TOOL_ARCH}.AppImage"
          chmod +x appimagetool

          export ARCH="$TOOL_ARCH"
          ./appimagetool --appimage-extract-and-run "$APPDIR" \
            "build/linux/${APP_NAME}-${{ matrix.artifact_tag }}-portable.AppImage"
          chmod +x "build/linux/${APP_NAME}-${{ matrix.artifact_tag }}-portable.AppImage"
          ls -lh "build/linux/${APP_NAME}-${{ matrix.artifact_tag }}-portable.AppImage"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_tag }}
          path: |
            build/linux/${{ env.APP_NAME }}-${{ matrix.artifact_tag }}-portable.AppImage
            build/linux/${{ env.APP_NAME }}-${{ matrix.artifact_tag }}.deb
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # macOS：arm64 + x64 各自独立 Job，不做 Universal Binary
  # ---------------------------------------------------------------------------
  macos:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
            xcode_arch: arm64
            artifact_tag: macos-arm64
          - arch: x64
            runner: macos-15-intel
            xcode_arch: x86_64
            artifact_tag: macos-x64
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          cache-key: flutter-${{ matrix.artifact_tag }}-${{ runner.os }}-${{ env.FLUTTER_VERSION }}

      - run: flutter pub get

      - name: Build macOS (${{ matrix.arch }})
        env:
          FLUTTER_XCODE_ARCHS: ${{ matrix.xcode_arch }}
        run: |
          # 注意：flutter build macos 没有 --no-codesign 选项（那是 build ios 的）。
          # Flutter 在 macOS 上默认使用本地 ad-hoc 签名（"-"），无需开发者证书。
          flutter build macos --release \
            --obfuscate \
            --split-debug-info=build/debug-info/macos/${{ matrix.arch }}

      # 无 Apple 证书时的兜底：对 .app 做一次 ad-hoc 签名。
      # arm64 上缺少有效签名的 app 可能无法启动；zip/dmg 分发不要求公证。
      - name: Ad-hoc sign app
        run: |
          codesign --force --deep --sign - \
            "build/macos/Build/Products/Release/${BIN_NAME}.app"
          codesign -dv "build/macos/Build/Products/Release/${BIN_NAME}.app" 2>&1 | head -5

      # .zip 保留父目录，解压直接得到 .app
      - name: Package .zip
        run: |
          cd build/macos/Build/Products/Release
          /usr/bin/ditto -c -k --keepParent "${BIN_NAME}.app" \
            "${APP_NAME}-${{ matrix.artifact_tag }}.zip"

      # .dmg：用 create-dmg 创建带窗口样式的安装镜像
      - name: Build .dmg installer
        run: |
          set -e
          BUNDLE="build/macos/Build/Products/Release"
          APP_PATH="${BUNDLE}/${BIN_NAME}.app"
          OUTPUT="build/macos/${APP_NAME}-${{ matrix.artifact_tag }}.dmg"

          command -v create-dmg || brew install create-dmg

          create-dmg \
            --skip-jenkins \
            --volname "${APP_NAME}" \
            --window-size 520 320 \
            --icon-size 100 \
            --icon "${BIN_NAME}.app" 140 160 \
            --app-drop-link 380 160 \
            "$OUTPUT" \
            "$APP_PATH"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_tag }}
          path: |
            build/macos/Build/Products/Release/${{ env.APP_NAME }}-${{ matrix.artifact_tag }}.zip
            build/macos/${{ env.APP_NAME }}-${{ matrix.artifact_tag }}.dmg
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 汇总：下载所有架构产物 → 平铺到同一目录 → 创建 GitHub Release 上传
  # ---------------------------------------------------------------------------
  publish:
    name: Publish release
    needs: [android, windows, linux, macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Inspect & stage release assets
        run: |
          ls -R artifacts | head -50
          mkdir -p packages
          # upload-artifact 会保留路径结构（android 的 flutter-apk/、bundle/ 子目录，
          # macOS 的 Build/Products/Release/），直接 cp artifacts/* 会因目录失败。
          # 这里按扩展名递归收集并平铺到 packages/，文件名本身已带平台+架构 tag。
          find artifacts -type f \
            \( -iname '*.apk' -o -iname '*.aab' -o -iname '*.msix' \
            -o -iname '*.dmg' -o -iname '*.zip' -o -iname '*.deb' \
            -o -iname '*.appimage' -o -iname '*.exe' \) \
            -print0 | while IFS= read -r -d '' f; do
              cp -v "$f" packages/
            done
          echo ""
          echo "==> Final release assets:"
          ls -lh packages/
          # 至少要有桌面三端产物，否则说明上游某个 job 漏了东西
          test -n "$(ls -A packages/)" || { echo "no release assets collected"; exit 1; }

      - name: Create GitHub release & upload all assets
        uses: softprops/action-gh-release@v2
        with:
          files: packages/*
          generate_release_notes: true
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
